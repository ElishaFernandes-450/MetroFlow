name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unpack app files from the zip
        run: |
          if [ -f metroFlow-upload.zip ]; then unzip -o metroFlow-upload.zip; fi
          mkdir -p www
          cp index.html style.css app.js analysis.js sw.js manifest.webmanifest icon.svg Tone.js www/
      - name: Point the app at the live website
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.metroflow.app",
            "appName": "metroFlow",
            "webDir": "www",
            "server": { "url": "https://metroflow.elisha-keyboard.workers.dev", "androidScheme": "https" },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
      - run: npm install
      - run: npx cap add android
      - name: Allow the microphone for tempo detection
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: metroFlow-live-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
