name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unpack app files from the zip
        run: |
          if [ -f metroFlow-upload.zip ]; then unzip -o metroFlow-upload.zip; fi
          mkdir -p www
          cp index.html style.css app.js analysis.js sw.js manifest.webmanifest icon.svg Tone.js www/
      - name: Point the app at the live website
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.metroflow.app",
            "appName": "metroFlow",
            "webDir": "www",
            "server": { "url": "https://metroflow.elisha-keyboard.workers.dev", "androidScheme": "https" },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
      - run: npm install
      - run: npx cap add android
      - name: Allow the microphone for tempo detection
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
      - name: Write the icon script
        run: |
          cat > make_assets.py <<'PYEOF'
          # Builds Android launcher icons and splash screens from logo.png. Run from the project root after "cap add android".
          import os, glob
          from PIL import Image, ImageDraw, ImageFilter
          src = Image.open('logo.png').convert('RGB')
          W = src.size[0]
          k = W / 1254.0
          # the rounded tile inside the picture
          box = tuple(int(v * k) for v in (62, 60, 1192, 1190))
          tile = src.crop(box).convert('RGBA')
          def rounded(im, radius):
              m = Image.new('L', im.size, 0)
              ImageDraw.Draw(m).rounded_rectangle([0, 0, im.size[0] - 1, im.size[1] - 1], radius=radius, fill=255)
              im = im.copy(); im.putalpha(m); return im
          tile = rounded(tile, int(0.2 * tile.size[0]))
          BG = (8, 108, 114)
          res = 'android/app/src/main/res'
          def sz(im, n): return im.resize((n, n), Image.LANCZOS)
          dens = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, n in dens.items():
              out = f'{res}/mipmap-{d}'
              sz(tile, n).save(f'{out}/ic_launcher.png')
              c = sz(tile, n); m = Image.new('L', (n, n), 0); ImageDraw.Draw(m).ellipse([0, 0, n - 1, n - 1], fill=255)
              flat = Image.new('RGBA', (n, n), (0, 0, 0, 0)); flat.paste(sz(src.crop(tuple(int(v * k) for v in (100, 100, 1154, 1154))).convert('RGBA'), n), (0, 0)); flat.putalpha(m); flat.save(f'{out}/ic_launcher_round.png')
              f = int(n * 108 / 48)
              canvas = Image.new('RGBA', (f, f), (0, 0, 0, 0)); t = sz(tile, int(f * 0.62))
              canvas.paste(t, ((f - t.size[0]) // 2, (f - t.size[1]) // 2), t); canvas.save(f'{out}/ic_launcher_foreground.png')
          open(f'{res}/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#%02X%02X%02X</color>\n</resources>\n' % BG)
          # splash screens: diagonal teal gradient that matches the logo's own surroundings, logo tile in the middle
          c1, c2 = (10, 132, 135), (47, 207, 204)
          def splash(w, h):
              g = Image.new('RGB', (64, 64))
              px = g.load()
              for y in range(64):
                  for x in range(64):
                      t = (x + y) / 126.0
                      px[x, y] = tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3))
              g = g.resize((w, h), Image.BICUBIC).convert('RGBA')
              s = int(min(w, h) * 0.5); t = sz(tile, s)
              g.paste(t, ((w - s) // 2, (h - s) // 2), t)
              return g.convert('RGB')
          for p in glob.glob(f'{res}/drawable*/splash.png'):
              w, h = Image.open(p).size
              splash(w, h).save(p)
          # Android 12 and newer: colour and icon shown by the system splash
          sty = f'{res}/values/styles.xml'
          s = open(sty).read()
          if 'windowSplashScreenBackground' not in s:
              s = s.replace('<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">',
                            '<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">\n        <item name="windowSplashScreenBackground">#0A8487</item>\n        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>')
              open(sty, 'w').write(s)
          print('icons and splash done')
          PYEOF
      - name: Apply the metroFlow icon and splash screen
        run: |
          if [ -f logo.png ]; then
            pip install --quiet --break-system-packages pillow
            python3 make_assets.py
          else
            echo "logo.png not found, keeping default icon"
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: metroFlow-live-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
