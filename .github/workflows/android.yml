name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Unpack app files from the zip
        run: |
          if [ -f metroFlow-upload.zip ]; then unzip -o metroFlow-upload.zip; fi
          mkdir -p www
          cp index.html style.css app.js analysis.js sw.js manifest.webmanifest icon.svg Tone.js www/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: metroFlow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
